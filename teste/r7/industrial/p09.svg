<text x="16.000" y="247.000" font-size="3.89" fill="#000" text-anchor="start" font-weight="bold">NOTE</text>
<text x="16.000" y="251.500" font-size="2.78" fill="#000" text-anchor="start">1. Schemă electrică monofilară de principiu, fază PT. Dimensionare conform I7-2011, SR HD 60364-4-41, -4-43, -5-52 (2011), -5-54, SR EN 60909-0;</text>
<text x="16.000" y="254.700" font-size="2.78" fill="#000" text-anchor="start">branșament conform ST 4-JT / ST 3-JT (DEER).</text>
<text x="16.000" y="258.300" font-size="2.78" fill="#000" text-anchor="start">2. Nu fac obiectul prezentei planșe: racordul MT al OD conform ATR; legătura trafo–TGJT (conform furnizorului postului); priza de pământ (calcul separat);</text>
<text x="16.000" y="261.500" font-size="2.78" fill="#000" text-anchor="start">analiza de risc la trăsnet.</text>
<text x="16.000" y="265.100" font-size="2.78" fill="#000" text-anchor="start">3. Schemă de legare la pământ: TN-S din PT propriu. Rp ≤ 1 Ω, conform calcul.</text>
<text x="16.000" y="268.700" font-size="2.78" fill="#000" text-anchor="start">4. Secțiunile cablurilor sunt dimensionate la Iz&#x27; = Iz·kθ·kgrup·ksol (SR HD 60364-5-52 tab. B.52.x), la ΔU (I7-2011) și la stabilitatea termică; reglajele</text>
<text x="16.000" y="271.900" font-size="2.78" fill="#000" text-anchor="start">protecțiilor sunt cele înscrise pe planșă.</text>
<text x="16.000" y="275.500" font-size="2.78" fill="#000" text-anchor="start">5. Ipoteze de calcul: c_max = 1,10, c_min = 0,95; limite ΔU: 3/5 % de la punctul de delimitare.</text>
